name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Curriculum gate (eight checks)
        run: python3 curriculum/validate.py
      - name: Course catalog is in sync with the CSV
        run: |
          python3 curriculum/gen_courses.py
          git diff --exit-code -- curriculum/courses
      - name: Internal markdown links resolve
        run: python3 scripts/check_links.py
      - name: Asset-class crosswalk gate
        run: python3 crosswalk/validate_usecodes.py
      - name: Doctrine smoke tests
        run: python3 tests/run.py

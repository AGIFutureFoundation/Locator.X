name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      # The doctrine smokes build the synthetic fleet demo, and the builders
      # inline d3-delaunay, maplibre, fflate and terser from node_modules. CI
      # never installed them, so three checks — including the fixture
      # determinism guard — failed on every run with a FileNotFoundError rather
      # than with a finding. A gate that cannot run is not a gate.
      # Browsers are not needed in THIS workflow: tests/run.py builds pages but
      # drives none. The headless-Chromium fleet smoke is its own workflow
      # (fleet-smoke.yml), which installs Chromium itself.
      - name: Install the JS libraries the builders inline
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Curriculum gate (eight checks)
        run: python3 curriculum/validate.py
      - name: Course catalog and the CSV are what curriculum.py says
        run: |
          python3 curriculum/gen_courses.py
          git diff --exit-code -- curriculum/courses curriculum/curriculum-50.csv
      - name: Internal markdown links resolve
        run: python3 scripts/check_links.py
      - name: Asset-class crosswalk gate
        run: python3 crosswalk/validate_usecodes.py
      - name: Market data gate
        run: python3 market/validate_market.py
      - name: Market register and measured capability claims
        run: python3 scripts/validate_landscape.py
      - name: Company layer gate — branded names, pricing labels, language lint
        run: python3 scripts/validate_company.py
      - name: Investor deck states no unmeasured figure
        run: python3 scripts/build_deck.py --check
      - name: Criteria feasibility — no market ceiling overstated
        run: python3 scripts/standard_feasibility.py --check
      - name: Coverage inventory and crosswalk agree
        run: python3 scripts/crosscheck_sources.py
      - name: Expansion ranking regenerates clean
        run: python3 scripts/expansion_rank.py --check
      - name: Social copy states no unmeasured figure
        run: python3 scripts/build_social.py --check
      - name: Doctrine smoke tests
        run: python3 tests/run.py

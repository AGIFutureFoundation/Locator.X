<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="Locator.X">
  <title>Locator.X</title>
  <!-- X marks the spot; the dot at the crossing is the record itself. The hole
       around the dot is a real knockout (mask), not a fill painted in the host
       background colour — the app's own mark used fill="var(--bg)" there, which
       is undefined anywhere outside the app and left a black disc on every other
       surface. A logo has to hold on a ground it has never met. -->
  <defs>
    <linearGradient id="lxMarkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37B871"/>
      <stop offset="1" stop-color="#1E6B3E"/>
    </linearGradient>
    <mask id="lxMarkHole">
      <rect x="0" y="0" width="120" height="120" fill="#fff"/>
      <circle cx="60" cy="60" r="8" fill="#000"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#lxMarkGrad)" opacity=".14"/>
  <rect x="4" y="4" width="112" height="112" rx="28" fill="none"
        stroke="url(#lxMarkGrad)" stroke-width="2.5"/>
  <g mask="url(#lxMarkHole)">
    <g stroke="url(#lxMarkGrad)" stroke-width="13" stroke-linecap="round">
      <path d="M32 32 L88 88"/>
      <path d="M88 32 L32 88"/>
    </g>
  </g>
  <circle cx="60" cy="60" r="4.5" fill="url(#lxMarkGrad)"/>
</svg>

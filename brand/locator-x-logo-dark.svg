<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140"
     role="img" aria-label="Locator.X — public-record real estate">
  <title>Locator.X</title>
  <!-- Horizontal lockup. Clear space on every side is one X-height of the mark
       (28 units here); nothing else sets inside it. -->
  <defs>
    <linearGradient id="lxLogoGradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#37B871"/>
      <stop offset="1" stop-color="#2C9E5C"/>
    </linearGradient>
    <mask id="lxLogoHoleD">
      <rect x="0" y="0" width="560" height="140" fill="#fff"/>
      <circle cx="70" cy="70" r="8" fill="#000"/>
    </mask>
  </defs>
  <g transform="translate(10,10)">
    <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#lxLogoGradD)" opacity=".14"/>
    <rect x="4" y="4" width="112" height="112" rx="28" fill="none"
          stroke="url(#lxLogoGradD)" stroke-width="2.5"/>
  </g>
  <g mask="url(#lxLogoHoleD)">
    <g transform="translate(10,10)" stroke="url(#lxLogoGradD)" stroke-width="13" stroke-linecap="round">
      <path d="M32 32 L88 88"/>
      <path d="M88 32 L32 88"/>
    </g>
  </g>
  <circle cx="70" cy="70" r="4.5" fill="url(#lxLogoGradD)"/>
  <text x="156" y="76" font-family="Fraunces, Charter, 'Bitstream Charter', Georgia, serif"
        font-size="54" font-weight="600" letter-spacing="-1" fill="#F1ECE1">Locator<tspan
        fill="#5FBF84">.X</tspan></text>
  <text x="159" y="106" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', ui-monospace, monospace"
        font-size="15" letter-spacing="3.4" fill="#9A9081">PUBLIC-RECORD REAL ESTATE</text>
</svg>

<title>Locator.X — powered by AGI Corp</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,400..700,50&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F3F0; --panel:#FFFFFF; --panel2:#F7F8F6; --line:#DDE1DC; --line2:#C9CFC9;
  --ink:#172220; --ink2:#4E5A57; --muted:#7C8783;
  --accent:#E24E1B; --accent-ink:#B23A10; --accent-soft:#FBE7DF;
  --bay:#2F6F93; --bay-soft:#DCE9F1;
  --good:#2C7A4B; --good-soft:#DFF0E5; --warn:#B4781C; --warn-soft:#F8EBD3; --bad:#B23A3A; --bad-soft:#F6DFDF;
  --map-water:#C7DAE4; --map-land:#EDEAE2; --map-urban:#E4E0D6; --map-park:#D9E6D2; --map-road:#FFFFFF; --map-road2:#F4F0E6; --map-rail:#B9B3A6; --map-line:#B7B1A3; --map-nb:#9AA39E;
  --shadow:0 10px 30px rgba(23,34,32,.12), 0 1px 3px rgba(23,34,32,.08);
  --shadow-sm:0 1px 2px rgba(23,34,32,.05), 0 1px 1px rgba(23,34,32,.04);
  --r:12px; --r-sm:8px;
  --display:"Fraunces",Georgia,"Times New Roman",serif; --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1614; --panel:#16201D; --panel2:#1C2724; --line:#283532; --line2:#33423E;
  --ink:#E8EEEB; --ink2:#B6C1BD; --muted:#7F8D89;
  --accent:#F0653A; --accent-ink:#FF8A63; --accent-soft:#3A1F15;
  --bay:#6FA8CB; --bay-soft:#17303E;
  --good:#5FBF84; --good-soft:#163123; --warn:#E0A13E; --warn-soft:#3A2A10; --bad:#E06B6B; --bad-soft:#3B1C1C;
  --map-water:#0F1D27; --map-land:#1C2522; --map-urban:#232D29; --map-park:#1C2C24; --map-road:#3A4743; --map-road2:#2E3935; --map-rail:#4C5854; --map-line:#4C5854; --map-nb:#5A6862;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25);
}}
:root[data-theme="dark"]{
  --bg:#0F1614; --panel:#16201D; --panel2:#1C2724; --line:#283532; --line2:#33423E;
  --ink:#E8EEEB; --ink2:#B6C1BD; --muted:#7F8D89;
  --accent:#F0653A; --accent-ink:#FF8A63; --accent-soft:#3A1F15;
  --bay:#6FA8CB; --bay-soft:#17303E;
  --good:#5FBF84; --good-soft:#163123; --warn:#E0A13E; --warn-soft:#3A2A10; --bad:#E06B6B; --bad-soft:#3B1C1C;
  --map-water:#0F1D27; --map-land:#1C2522; --map-urban:#232D29; --map-park:#1C2C24; --map-road:#3A4743; --map-road2:#2E3935; --map-rail:#4C5854; --map-line:#4C5854; --map-nb:#5A6862;
  --shadow:0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  --shadow-sm:0 1px 2px rgba(0,0,0,.35), 0 1px 1px rgba(0,0,0,.25);
}
/* High contrast — dark-derived (reuses the dark theme's already CVD-validated
   category/sequential/status colors below; only the base surface and ink
   widen toward pure black/white for maximum separation) */
:root[data-theme="contrast"]{
  --bg:#000000; --panel:#0A0A0A; --panel2:#141414; --line:#5C5C5C; --line2:#7A7A7A;
  --ink:#FFFFFF; --ink2:#EDEDED; --muted:#ABABAB;
  --accent:#FF8552; --accent-ink:#FFB088; --accent-soft:#3A1F15;
  --bay:#9DD0F2; --bay-soft:#0F2433;
  --good:#5BEB93; --good-soft:#0B2A17; --warn:#FFD166; --warn-soft:#332400; --bad:#FF7A7A; --bad-soft:#330E0E;
  --map-water:#0A1620; --map-land:#181818; --map-urban:#202020; --map-park:#122016; --map-road:#5C5C5C; --map-road2:#3E3E3E; --map-rail:#7A7A7A; --map-line:#7A7A7A; --map-nb:#8C8C8C;
  --shadow:0 10px 30px rgba(0,0,0,.7), 0 1px 3px rgba(0,0,0,.6);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5), 0 1px 1px rgba(0,0,0,.4);
}
/* Signal — light-derived, built around the same red/amber/green scale this
   app already uses to mark investment fit (the map's "Goal fit" lens, the
   backtest verdicts, the below-market gauge), carried up into the app's own
   chrome as its accent so the doctrine is visible before you read a number. */
:root[data-theme="signal"]{
  --bg:#F1F5F1; --panel:#FFFFFF; --panel2:#F5F9F4; --line:#DCE6DA; --line2:#C7D6C4;
  --ink:#16211A; --ink2:#485449; --muted:#77857A;
  --accent:#2C7A4B; --accent-ink:#1E5B37; --accent-soft:#DFF0E5;
  --bay:#2F6F93; --bay-soft:#DCE9F1;
  --good:#2C7A4B; --good-soft:#DFF0E5; --warn:#B4781C; --warn-soft:#F8EBD3; --bad:#B23A3A; --bad-soft:#F6DFDF;
  --map-water:#C7DAE4; --map-land:#EDEEE8; --map-urban:#E4E6DC; --map-park:#D3E8CB; --map-road:#FFFFFF; --map-road2:#F0F3EA; --map-rail:#AEB6A8; --map-line:#ACB4A5; --map-nb:#8FA391;
  --shadow:0 10px 30px rgba(23,34,32,.14), 0 1px 3px rgba(23,34,32,.09);
  --shadow-sm:0 1px 2px rgba(23,34,32,.06), 0 1px 1px rgba(23,34,32,.04);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:var(--bay)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- frame ---------- */
/* ---------- the frame, made responsive ----------
   The app used to be a fixed-width desktop layout that happened to open on a
   desktop. Twenty-eight nav buttons in an unwrapped flex row set the intrinsic
   width of the header; the header set the width of the grid; and .page, being
   absolutely positioned inside it, inherited 2,538px. Every viewport tested -
   including a 1440px desktop - overflowed horizontally. The fix is three rules:
   the grid is pinned to the viewport width, every flex child is allowed to
   shrink (min-width:0, which flexbox does NOT do by default), and the tab row
   scrolls inside itself instead of pushing the page. */
#app{display:grid;grid-template-rows:52px auto auto 1fr;height:100vh;height:100dvh;
     width:100%;max-width:100vw;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--panel);
       border-bottom:1px solid var(--line);z-index:5;min-width:0;flex-wrap:nowrap;
       box-shadow:inset 0 2px 0 0 var(--good)}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0;flex:none}

/* the section bar: six groups, always visible, never scrolling */
.groupbar{display:flex;gap:3px;padding:6px 12px 0;background:var(--panel);min-width:0;
          overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.groupbar::-webkit-scrollbar{display:none}
.groupbar button{background:none;border:0;padding:7px 13px;border-radius:var(--r-sm) var(--r-sm) 0 0;
                 color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.01em;
                 white-space:nowrap;min-height:40px;cursor:pointer;transition:color .12s ease,background .12s ease}
.groupbar button:hover{color:var(--ink)}
.groupbar button[aria-selected="true"]{color:var(--ink);background:var(--bg);
                 box-shadow:inset 0 -2px 0 var(--accent)}

/* the view row: only the active group's tabs are shown */
nav.tabs{display:flex;gap:2px;padding:5px 12px;background:var(--bg);min-width:0;
         overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
         border-bottom:1px solid var(--line)}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{display:none}
nav.tabs button.ingroup{display:inline-block}

/* the hamburger, mobile only */
.navtoggle{display:none;flex-direction:column;gap:3px;background:none;border:0;
           padding:10px 8px;min-height:44px;min-width:44px;cursor:pointer}
.navtoggle span{display:block;width:18px;height:2px;background:var(--ink);border-radius:2px}
.brand .name{font-family:var(--display);font-size:22px;font-weight:600;font-variation-settings:"SOFT" 50;letter-spacing:-.01em}
.brand .name .x{color:#2C9E5C}
:root[data-theme="dark"] .brand .name .x,:root[data-theme="contrast"] .brand .name .x{color:#5FBF84}
.brand .sub{font-size:10.5px;color:var(--ink2);letter-spacing:.09em;text-transform:uppercase;font-weight:600;
            padding-left:10px;border-left:1px solid var(--line2);align-self:center}
header .brand{cursor:pointer}

/* ---------- title page / cover screen ---------- */
#coverpage{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
  padding:24px;background:
    radial-gradient(60% 50% at 50% 0%, color-mix(in srgb, var(--good) 14%, transparent), transparent 70%),
    var(--bg);
  opacity:1;transition:opacity .38s ease, visibility 0s linear 0s}
#coverpage[hidden]{display:flex;opacity:0;visibility:hidden;transition:opacity .38s ease, visibility 0s linear .38s;pointer-events:none}
#coverpage.leaving{opacity:0}
#coverpage .coverbg{position:absolute;inset:0;z-index:-1}
.covercard{position:relative;max-width:520px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:coverIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes coverIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.covermark{width:84px;height:84px;margin-bottom:10px;filter:drop-shadow(0 8px 20px color-mix(in srgb, var(--good) 30%, transparent))}
.coverbrand{font-family:var(--display);font-size:clamp(34px,7vw,52px);font-weight:600;letter-spacing:-.015em;font-variation-settings:"SOFT" 50;color:var(--ink)}
.coverbrand .x{color:var(--good)}
.coversub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.covertag{font-size:14.5px;line-height:1.55;color:var(--ink2);max-width:44ch;margin:14px 0 4px}
.coverstat{font-family:var(--mono);font-size:12.5px;color:var(--good);letter-spacing:.02em;margin-bottom:18px;min-height:16px}
.coverenter{background:var(--good);color:#fff;border:0;padding:12px 26px;border-radius:999px;font-weight:600;font-size:14.5px;
  box-shadow:0 6px 18px color-mix(in srgb, var(--good) 35%, transparent);transition:transform .15s ease, box-shadow .15s ease}
.coverenter:hover{transform:translateY(-1px);box-shadow:0 9px 22px color-mix(in srgb, var(--good) 45%, transparent)}
.coverskip{font-size:11px;color:var(--muted);margin-top:12px}
@media (max-width:480px){ .covertag{font-size:13.5px} .covermark{width:68px;height:68px} }
nav.tabs button{background:none;border:0;padding:8px 13px;border-radius:var(--r-sm);
                color:var(--ink2);font-weight:500;white-space:nowrap;min-height:40px;cursor:pointer;
                transition:background .12s ease,color .12s ease}
nav.tabs button:hover{background:var(--panel2);color:var(--ink)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);font-weight:600}
header .spacer{flex:1}
header .stat{font-size:12px;color:var(--muted)}
header .stat b{color:var(--ink);font-family:var(--mono);font-weight:500}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:6px 10px;font-size:12px;color:var(--ink2);transition:border-color .15s ease, color .15s ease, box-shadow .15s ease}
.iconbtn:hover{border-color:var(--line2);color:var(--ink);box-shadow:var(--shadow-sm)}

main{position:relative;min-height:0}
.view{position:absolute;inset:0;display:none}
.view.active{display:block}

/* ---------- map view ---------- */
#mapview{display:none;grid-template-columns:minmax(0,360px) minmax(0,1fr);height:100%;min-width:0}
#mapview.active{display:grid}
#rail{display:flex;flex-direction:column;border-right:1px solid var(--line);background:var(--panel);min-height:0;min-width:0;overflow:auto}
/* This media block has to come AFTER the #rail base rule.  It used to sit
   above it, so at equal specificity the base rule won at every width and the
   rail never collapsed: on a 393px phone it stayed 497px wide and pushed the
   map off the screen.  On a narrow screen the filters now sit above the map as
   a full-width, height-capped strip rather than being hidden outright — a map
   you cannot filter is not an improvement on a map you have to scroll to. */
@media (max-width:900px){
  #mapview{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  #mapview.active{grid-template-columns:minmax(0,1fr)}
  #rail{border-right:0;border-bottom:1px solid var(--line);max-height:46vh}
  #rail .filters{padding:10px 12px}
}
.filters{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.filters .row{display:flex;gap:8px;align-items:center}
.filters select,.filters input[type=text],.filters input[type=number]{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel2);border-radius:var(--r-sm);padding:6px 8px;font-size:13px}
.filters label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;width:64px;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
#twinlayers .chip.on,label.chip:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink2);font-weight:500;transition:background .12s ease,color .12s ease,border-color .12s ease}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.listhead{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line)}
.listhead select{border:0;background:transparent;font-size:12px;color:var(--ink2)}
#list{overflow:auto;flex:1;min-height:0}
.card{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s ease}
.card:hover{background:var(--panel2)}
.card.sel{background:var(--accent-soft);box-shadow:inset 2px 0 0 var(--accent)}
.card .price{font-family:var(--mono);font-weight:500;font-size:15px}
.card .addr{font-weight:500}
.card .meta{color:var(--muted);font-size:12px;grid-column:1/-1}
.card .badge{justify-self:end;align-self:start}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--panel2);color:var(--ink2);white-space:nowrap}
.badge.good{background:var(--good-soft);color:var(--good)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.bay{background:var(--bay-soft);color:var(--bay)}
.badge.imp{background:var(--accent-soft);color:var(--accent-ink)}
.star{background:none;border:0;color:var(--muted);font-size:16px;padding:0 4px;line-height:1}
.star.on{color:var(--accent)}

#mapwrap{position:relative;min-width:0}
#map{position:absolute;inset:0;background:var(--map-water)}
.maptools{position:absolute;top:10px;left:10px;display:flex;gap:6px;z-index:2;flex-wrap:wrap;max-width:calc(100% - 20px)}
/* On a phone the toolbar wraps into six or seven rows and covers the map it is
   supposed to control.  Below 720px it collapses behind a single Layers button
   and opens as a panel, so the default state is a map you can actually see. */
.maptoggle{display:none}
@media (max-width:720px){
  .maptoggle{display:inline-flex;align-items:center;gap:6px;position:absolute;top:10px;left:10px;z-index:3;
    border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:var(--r-sm);
    padding:7px 11px;font-size:12.5px;box-shadow:var(--shadow);cursor:pointer}
  .maptools{top:52px;left:10px;right:10px;max-width:none;flex-direction:column;align-items:stretch;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
    padding:10px;gap:8px;max-height:56vh;overflow:auto}
  .maptools[hidden]{display:none!important}
  .maptools select,.maptools button{width:100%;box-sizing:border-box;text-align:left;box-shadow:none}
  .maptools .legend,.maptools .maplegend{width:100%}
}
.maptools select,.maptools button{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:6px 9px;font-size:12px;box-shadow:var(--shadow);color:var(--ink)}
.legend{position:absolute;left:10px;bottom:26px;z-index:2;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;font-size:11px;box-shadow:var(--shadow);display:none}
.legend.on{display:block}
.legend .bar{height:8px;border-radius:4px;margin:4px 0}
.legend .ends{display:flex;justify-content:space-between;font-family:var(--mono)}
.attrib{position:absolute;right:6px;bottom:4px;font-size:10px;color:var(--muted);background:color-mix(in srgb,var(--panel) 80%,transparent);padding:2px 6px;border-radius:4px;z-index:2;max-width:70%;text-align:right}
.notice{position:absolute;top:52px;left:10px;right:10px;z-index:3;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-sm);padding:8px 12px;font-size:12px;display:none}
.notice.on{display:block}

/* markers */
.pin{cursor:pointer;line-height:1}
.pin .pill{display:inline-block}
.pin .pill{background:var(--panel);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:2px 8px;font:500 11px var(--mono);white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);transition:transform .12s}
.pin .dot{width:11px;height:11px;border-radius:50%;background:var(--ink);border:2px solid var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.35);display:none}
.pin.cf .pill{border-color:var(--good);color:var(--good)} .pin.cf .dot{background:var(--good)}
.pin.neg .pill{border-color:var(--ink2);color:var(--ink2)} .pin.neg .dot{background:var(--ink2)}
.pin.imp .pill{border-style:dashed}
.pin.sel .pill{background:var(--accent);color:#fff;border-color:var(--accent);transform:scale(1.12);z-index:10} .pin.sel .dot{background:var(--accent);width:15px;height:15px}
.pin:hover .pill{transform:scale(1.08)}
.zoomed-out .pin .pill{display:none} .zoomed-out .pin .dot{display:block}
.citylbl{font:600 11px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);text-shadow:0 0 3px var(--map-land),0 0 6px var(--map-land);pointer-events:none;white-space:nowrap}
.citylbl.big{font-size:13px;color:var(--ink)}
.citylbl.hid{display:none}
.citylbl.nb{font-size:10px;font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);opacity:.9;z-index:0}
.maplibregl-ctrl-group{box-shadow:var(--shadow)!important;background:var(--panel)!important;border:1px solid var(--line)}
.maplibregl-ctrl-group button{background:transparent!important}
.maplibregl-ctrl-group button + button{border-top:1px solid var(--line)!important}
.maplibregl-ctrl button .maplibregl-ctrl-icon{filter:var(--ctrl-filter,none)}
:root[data-theme="dark"] .maplibregl-ctrl button .maplibregl-ctrl-icon,:root[data-theme="contrast"] .maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(1)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .maplibregl-ctrl button .maplibregl-ctrl-icon{filter:invert(1)} }
.maplibregl-ctrl-attrib{display:none}
.cm-ctrl{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow);z-index:2}
.cm-ctrl button{width:30px;height:30px;border:0;background:transparent;font-size:18px;color:var(--ink);line-height:1}
.cm-ctrl button+button{border-top:1px solid var(--line)}
.cm-marker{will-change:transform}

/* ---------- detail drawer ---------- */
#drawer{position:absolute;top:0;right:0;bottom:0;width:420px;max-width:100%;background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .22s ease;z-index:4;display:flex;flex-direction:column;box-shadow:var(--shadow)}
#drawer.open{transform:none}
@media (prefers-reduced-motion: reduce){ #drawer{transition:none} }
.dhead{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.dhead h2{font-family:var(--display);font-size:20px;font-weight:600;line-height:1.15}
.dhead .close{margin-left:auto}
.dbody{overflow:auto;padding:0 16px 24px;flex:1}
.hero{margin:12px -16px 0;position:relative;height:170px;overflow:hidden;background:var(--panel2)}
.hero canvas,.hero img{width:100%;height:100%;object-fit:cover;display:block}

<style>
/* ============================================================================
   Surface layer — the gloss pass.

   A refinement over the tokens above, not a second design system: every colour
   here resolves from --panel / --line / --ink, so the light, dark and
   high-contrast themes keep working and a token change still propagates.

   Three rules kept it honest rather than decorative:

   1. VIBRANCY ONLY WHERE SOMETHING IS BEHIND IT. Translucency reads as quality
      when it reveals depth and as mud when it does not. The map tools, the
      drawers and the cover card float over content and get real backdrop
      blur; the header and the section bar sit in a grid with nothing behind
      them, so they get gradient, hairline and shadow instead of a blur that
      would cost a compositor layer and show nothing.
   2. HIGH CONTRAST IS EXEMPT. Translucency lowers effective contrast, so the
      contrast theme opts out of every glass surface and keeps flat fills.
   3. NOTHING MOVES THAT CANNOT BE STILLED. Every transition here is inside the
      reduced-motion guard at the end.
   ========================================================================== */
:root{
  --r-lg:16px;
  --ease:cubic-bezier(.32,.72,0,1);          /* iOS-ish: quick out, soft settle */
  --ring:color-mix(in srgb, var(--accent) 55%, transparent);
  --gloss:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0) 58%);
  --glass:color-mix(in srgb, var(--panel) 78%, transparent);
  --hairline:color-mix(in srgb, var(--line) 78%, transparent);
  --lift:0 1px 1px rgba(23,34,32,.04), 0 4px 12px -4px rgba(23,34,32,.14);
  --lift-2:0 2px 4px rgba(23,34,32,.06), 0 14px 34px -12px rgba(23,34,32,.22);
}
@supports not (color: color-mix(in srgb, red 50%, transparent)){
  :root{ --ring:var(--accent); --glass:var(--panel); --hairline:var(--line); }
}
:root[data-theme="dark"], :root:not([data-theme="light"]){
  --lift:0 1px 1px rgba(0,0,0,.36), 0 4px 12px -4px rgba(0,0,0,.5);
  --lift-2:0 2px 4px rgba(0,0,0,.4), 0 14px 34px -12px rgba(0,0,0,.62);
}

/* ---- chrome: gradient + hairline, no wasted blur ------------------------- */
header{
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--panel) 100%, #fff 4%), var(--panel));
  border-bottom:1px solid var(--hairline);
  box-shadow:inset 0 2px 0 0 var(--good), 0 1px 0 rgba(23,34,32,.04);
}
.groupbar{
  gap:2px; padding:7px 12px 7px; background:var(--panel);
  border-bottom:1px solid var(--hairline);
}
/* the section bar as a segmented control: a recessed track, a raised pill */
.groupbar button{
  border-radius:999px; padding:6px 14px; min-height:34px; font-size:12.5px;
  letter-spacing:.005em; transition:color .18s var(--ease), background .18s var(--ease),
  box-shadow .18s var(--ease), transform .18s var(--ease);
}
.groupbar button:hover{ background:color-mix(in srgb, var(--ink) 6%, transparent); }
.groupbar button[aria-selected="true"]{
  background:var(--panel2); color:var(--ink); box-shadow:var(--lift);
  background-image:var(--gloss);
}
nav.tabs{ background:var(--bg); border-bottom:1px solid var(--hairline); padding:6px 12px; }
nav.tabs button{ border-radius:999px; padding:7px 13px; min-height:34px;
  transition:background .18s var(--ease), color .18s var(--ease), box-shadow .18s var(--ease); }
nav.tabs button:hover{ background:color-mix(in srgb, var(--ink) 7%, transparent); }
nav.tabs button[aria-selected="true"]{
  background:var(--ink); color:var(--bg); box-shadow:var(--lift); background-image:var(--gloss);
}

/* ---- controls: a little gloss, a lot of affordance ----------------------- */
.btn{ border-radius:999px; box-shadow:var(--lift);
  background-image:var(--gloss);
  transition:transform .18s var(--ease), box-shadow .18s var(--ease),
             border-color .18s var(--ease), background-color .18s var(--ease); }
.btn:hover{ box-shadow:var(--lift-2); transform:translateY(-1px); }
.btn:active{ transform:translateY(0); box-shadow:var(--lift); }
.btn.primary{ background-image:var(--gloss); }
.chip{ transition:background .18s var(--ease), color .18s var(--ease),
                  border-color .18s var(--ease), box-shadow .18s var(--ease); }
.chip:hover{ box-shadow:var(--lift); }
.chip[aria-pressed="true"]{ box-shadow:var(--lift); background-image:var(--gloss); }
.filters input, .filters select, .listhead select, .maptools select{

  outline:2px solid var(--ring); outline-offset:2px; border-radius:8px;

/* ---- surfaces that DO have something behind them: real vibrancy ---------- */
.maptools{
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border:1px solid var(--hairline); border-radius:var(--r-lg); box-shadow:var(--lift-2);

.card:hover{ box-shadow:inset 3px 0 0 color-mix(in srgb, var(--accent) 45%, transparent); }

.card .price{ font-variant-numeric:tabular-nums; }

.num, .card .meta .num, .listhead{ font-variant-numeric:tabular-nums; }

:root[data-theme="contrast"] .maptools,
:root[data-theme="contrast"] .covercard{
  background:var(--panel); -webkit-backdrop-filter:none; backdrop-filter:none;

:root[data-theme="contrast"] nav.tabs button[aria-selected="true"],
:root[data-theme="contrast"] .btn, :root[data-theme="contrast"] .chip{
  background-image:none;
}

@media (prefers-reduced-motion: reduce){
  header, .groupbar button, nav.tabs button, .btn, .chip, .card,
  .filters input, .filters select{ transition:none !important; }
  .btn:hover{ transform:none; }
}
</style>

<style>
/* ---- the headline projection ---------------------------------------------
   The reveal is the finding: the published history is fixed and draws first,
   the projection extends out of its last real point, and the measured error
   band fades in around it. Values never move — only the reveal — and the whole
   sequence is inert under reduced motion, where the finished state is drawn
   immediately. */
.pvhero-card{ position:relative; overflow:hidden; }

.pvproj{ fill:none; stroke:var(--accent); stroke-width:2.25; stroke-linecap:round; stroke-linejoin:round;
         stroke-dasharray:900; stroke-dashoffset:900; animation:pvdraw .85s var(--ease) 1s forwards; }
.pvband{ fill:var(--accent); opacity:0; animation:pvfade .7s var(--ease) 1.25s forwards; }
.pvnow{ fill:var(--ink); opacity:0; animation:pvfade .35s var(--ease) 1s forwards; }
